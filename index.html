<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goal Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <div class="max-w-xl mx-auto border border-slate-700 rounded-3xl p-6 text-center mt-5 bg-slate-100 space-y-2 z-50 shadow shadow-2xl">
    <h1 class="font-bo">Savings Tracker</h1>

    <div class="">
      <h3 id="display-goal-name" class="font-medium text-slate-700/70">Goal: Not Set</h3>
      <p><span id="display-saved">Ksh.0</span> / <span id="display-target">Ksh.0</span></p>
      
      <div class="max-w-full mx-auto border border-slate-700 rounded-2xl bg-white">
        <div class=" bg-blue-400 rounded-3xl" id="progress-bar">0%</div>
      </div>
    </div>

    <form id="goal-form" class="space-y-2">
      <div class="form-group">
        <label for="goal-name" class="block font-medium text-slate-700/70">Savings Goal Name</label>
        <input type="text" id="goal-name" placeholder="e.g., Emergency Fund, New Laptop" required class="w-full rounded-2xl p-3">
      </div>
      <div class="form-group">
        <label for="target-amount" class="block font-medium text-slate-700/70">Target Amount (Ksh.)</label>
        <input type="number" id="target-amount" min="1" placeholder="e.g., 1000" required class="w-full rounded-2xl p-3">
      </div>
      <button type="submit">Set / Update Goal</button>
    </form>

    <form id="deposit-form">
      <div class="form-group">
        <label for="deposit-amount" class="block font-medium text-slate-700/70">Add Savings (Ksh.)</label>
        <input type="number" id="deposit-amount" min="1" step="any" placeholder="e.g., 50" required class="w-full rounded-2xl p-3">
      </div>
      <button type="submit" class="max-w-xl bg-blue-400/50 p-2 rounded-2xl my-3">Deposit Money</button>
    </form>

    <div class="history">
      <h2>Deposit History</h2>
      <ul class="text-blue-400" id="history-list">
        
      </ul>
      <div class="actions">
        <button id="reset-btn" class="w-full bg-green-500 p-1 my-1 rounded-3xl">Reset Tracker</button>
      </div>
    </div>
  </div>

  <script src="script.js">
  
    
  </script>
</body>
</html>
